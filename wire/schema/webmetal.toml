# Control requests: guest to host, one reply each ----------------------------------------------------------------------

[[op]]
code = 0x0001
name = "Open"
channel = "control"
args = ["schema_hash: Hash", "pid: i32"]
reply = ["schema_hash: Hash"]
doc = "First request on a connection. The host compares schema_hash with its own and refuses the connection (status Invalid) when they differ. pid is the opening task's process id, for diagnostics."

[[op]]
code = 0x0002
name = "FetchEvents"
channel = "control"
args = ["queue: CommandQueue?"]
reply = ["events: bytes"]
doc = "Collect the pending event records of a command queue (nil: device-level events). The reply carries a sequence of event-channel records. Sent after the event doorbell for that queue fires."

[[op]]
code = 0x0003
name = "Release"
channel = "control"
args = ["object: Object"]
doc = "The guest object for this handle was deallocated. Handles are never reused within a connection."

[[op]]
code = 0x0004
name = "SetLabel"
channel = "control"
methods = ["MTLResource setLabel:", "MTLHeap setLabel:", "MTLCommandQueue setLabel:", "MTLEvent setLabel:"]
receiver = "object"
args = ["object: Object", "label: str?"]

[[op]]
code = 0x0101
name = "CreateCommandQueue"
channel = "control"
methods = ["MTLDevice newCommandQueue"]
result = "queue"
args = ["queue: CommandQueue"]


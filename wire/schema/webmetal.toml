# Events: host to guest, collected with FetchEvents. Times are nanoseconds of the embedder's monotonic clock; they
# are not hardware GPU times.
[[op]]
code = 0x7001
name = "CommandBufferScheduled"
channel = "event"
args = ["command_buffer: CommandBuffer", "kernel_start_time: u64", "kernel_end_time: u64"]
doc = "The command buffer's stream was accepted and all its work submitted to the host GPU queue. kernel_start_time is when the host began processing the command buffer and kernel_end_time when it had submitted all its work, the two times the kernel's scheduled notification carries (IOGPUFamily's IOGPUCommandQueue reads the clock when it begins a submission and again once the command buffer is processed and submitted, and IOGPU passes both to didScheduleWithStartTime:endTime:error:, which stores kernelStartTime and kernelEndTime)."

[[op]]
code = 0x7002
name = "CommandBufferCompleted"
channel = "event"
args = ["command_buffer: CommandBuffer", "status: u64 (MTLCommandBufferStatus)", "failure: Failure", "failed_offset: u64", "kernel_start_time: u64", "kernel_end_time: u64", "gpu_start_time: u64", "gpu_end_time: u64"]
doc = "The command buffer finished: status is MTLCommandBufferStatusCompleted or MTLCommandBufferStatusError. failure.status is 0 on success; failed_offset is the stream byte offset of the record that failed, 0xffffffffffffffff when no single record did. All writes the command buffer made to CPU-visible memory are in guest memory before this event is posted."

[[op]]
code = 0x7003
name = "SharedEventListener"
channel = "event"
args = ["event: Event", "token: u64", "value: u64"]
doc = "A NotifyListener registration was reached; value is the event's signaled value at that time."

[[op]]
code = 0x7004
name = "DeviceLost"
channel = "event"
args = ["failure: Failure"]
doc = "The host GPU device was lost. Every in-flight and later command buffer completes with an error."

# Guest-local methods: driver-protocol methods that have no record because the guest answers them without the host.
# reason is one of the values target_surface.py defines (profile, object-state, framework, guest-runtime, guest-memory,
# kernel-object, unreachable, absent, unavailable); framework, absent, unavailable and unreachable are verified against
# the 21H461 implementation layers. protocols = ["*"] means every MTL* protocol that declares the selector.

[[local]]
reason = "object-state"
protocols = ["*"]
selectors = ["device", "label"]
note = "The owning device and the label are guest object state. Labels the host uses travel in SetLabel, Commit and EncoderSetLabel."

[[local]]
reason = "object-state"
protocols = ["MTLCommandBuffer"]
selectors = ["setLabel:"]
note = "Carried in Commit."

[[local]]
reason = "object-state"
protocols = ["MTLCommandBufferSPI"]
selectors = ["setProtectionOptions:", "protectionOptions"]
note = "Carried in Commit."

[[local]]
reason = "object-state"
protocols = ["MTLArgumentEncoder", "MTLDynamicLibrary"]
selectors = ["setLabel:"]

[[local]]
reason = "framework"
protocols = ["MTLBinaryArchive", "MTLFence"]
selectors = ["setLabel:"]

[[local]]
reason = "object-state"
protocols = ["MTLCommandQueue"]
selectors = ["commandBuffer", "commandBufferWithUnretainedReferences", "commandBufferWithDescriptor:"]
note = "A command buffer is a guest object until Commit, which carries its queue, retained_references and error_options (the whole MTLCommandBufferDescriptor state on 21H461)."

[[local]]
reason = "framework"
protocols = ["MTLCommandQueue"]
selectors = ["insertDebugCaptureBoundary"]

[[local]]
reason = "guest-runtime"
protocols = ["MTLCommandQueueSPI"]
selectors = ["setCompletionQueue:", "setSubmissionQueue:"]
note = "Dispatch queues on which the guest submits and runs handlers."

[[local]]
reason = "framework"
protocols = ["MTLCommandBuffer"]
selectors = ["addCompletedHandler:", "addScheduledHandler:", "enqueue", "error", "errorOptions", "GPUEndTime", "GPUStartTime",
             "kernelEndTime", "kernelStartTime", "status", "waitUntilCompleted", "waitUntilScheduled", "retainedReferences",
             "logs", "commandQueue", "presentDrawable:", "presentDrawable:atTime:", "presentDrawable:afterMinimumDuration:"]
note = "_MTLCommandBuffer implements the status machine, handlers, waits and timing fields; the plugin feeds it from CommandBufferScheduled and CommandBufferCompleted. enqueue order is kept by the framework's queue, which hands buffers to the driver's commit in that order."

[[local]]
reason = "framework"
protocols = ["MTLCommandBufferSPI"]
selectors = ["commitAndWaitUntilSubmitted"]

[[local]]
reason = "object-state"
protocols = ["MTLRenderCommandEncoder"]
selectors = ["tileWidth", "tileHeight"]
note = "Encoder state fixed by the render pass descriptor in BeginRenderPass."

[[local]]

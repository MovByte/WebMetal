# WebMetal wire protocol: the single source of truth.
#
# wire/gen/wiregen.py generates from this file the ObjC++ encoder header (wire/generated/WebMetalWire.h), the Rust
# decoder and encoder (wire/src/generated.rs), the fuzz value generators for both languages and the opcode table
# (wire/generated/opcodes.md). Hand-written copies of any of them are forbidden. The protocol version is the SHA-256 of
# this file's bytes; both ends exchange it in Open and refuse a connection whose hash differs.
#
# wire/tools/target_surface.py checks this file against the iPadOS 17.7.11 (21H461) binaries: every op's arguments
# against the extended type encoding of each Metal method it lists, every descriptor struct against its class's
# settable state, every guest-local annotation against the declaring protocol and the implementing layer, and coverage of
# the QuartzCore driver-selector list (wire/target/quartzcore-driver-selectors.tsv).
#
# Field syntax: "name: type", optionally followed by " (MetalType)" naming the Metal enum or typedef the raw value
# belongs to, and by " = expr" stating that an array, byte string or string has exactly as many elements as the value of
# expr (another field of the same record, or field.member). Types:
#
#   u8 u16 u32 u64 i32 i64 f32 f64 bool   little-endian scalars; bool is one byte, 0 or 1
#   Kind, Kind?                           object handle (u64); Kind names an [[object]]; Kind? allows 0 (nil)
#   Struct, Struct?                       a [[struct]]; Struct? is a u8 presence tag (0 or 1) followed by the struct
#   str, str?, url?                       UTF-8 string: u32 byte count (0xffffffff: nil), bytes; url? carries an
#                                         NSURL as its absolute string
#   cstr?                                 C string: like str? but any bytes except NUL, not necessarily UTF-8
#   bytes                                 u32 byte count, bytes
#   [T]                                   u32 element count, elements
#   [u8; N]                               N bytes, no count
#   value?                                a property-list value (NSDictionary, NSArray, NSString, NSNumber, NSData), or nil
#   guest_addr                            u64 virtual address in the calling task; the host reads or writes it during
#                                         the request (control) or when the command executes (stream)
#   surface                               u32 IOSurfaceID
#   block, out, present                   one byte, 1 when the caller passed a non-nil block / out-pointer / object that
#                                         has no wire form (the block, pointer or object stays in the guest)

[schema]
name = "webmetal"
record_alignment = 8
header = ["opcode: u16", "flags: u16", "length: u32"]
reply_bit = 0x8000
value_depth_limit = 32

# The accelerator service and its user client. Metal.framework (343.21 on 21H461) matches services in category
# IOAcceleratorES and loads the bundle named by MetalPluginName from /System/Library/Extensions, instantiating
# MetalPluginClassName. The selectors below are this protocol's, numbered from 0 in list order;
# every call passes and returns 64-bit scalars only.
[transport]
service_class = "WebMetalAccelerator"
match_category = "IOAcceleratorES"
metal_plugin_name = "WebMetal"
metal_plugin_class_name = "WebMetalDevice"
user_client_type = 0
selectors = [
  "control: in [request_addr, request_length, reply_addr, reply_capacity] out [reply_length]; runs one control request read from the calling task and writes its reply; when reply_length > reply_capacity nothing is written and the reply stays pending",
  "fetch_reply: in [reply_addr, reply_capacity] out [reply_length]; writes the pending reply of the last control call, which is not run again",
  "register_event_port: async (wake port, reference) in [queue_handle] out []; the host sends an async completion with arguments [queue_handle] whenever events for that queue (0: device-level) become pending; the guest then sends FetchEvents",
]

# Object kinds. A handle is a u64 the guest allocates, unique for the life of the connection and never reused; 0 is
# nil. The same value is the word an argument buffer holds for a texture, sampler or buffer reference.
[[object]]
name = "Object"
protocols = []
doc = "Any object kind."

[[object]]
name = "Resource"
protocols = ["MTLResource", "MTLBuffer", "MTLTexture"]
doc = "A buffer or a texture."

[[object]]
name = "Buffer"
protocols = ["MTLBuffer"]

[[object]]
name = "Texture"
protocols = ["MTLTexture"]

[[object]]
name = "Heap"
protocols = ["MTLHeap"]

[[object]]
name = "SamplerState"
protocols = ["MTLSamplerState"]

[[object]]
name = "DepthStencilState"
protocols = ["MTLDepthStencilState"]

[[object]]
name = "RenderPipelineState"
protocols = ["MTLRenderPipelineState"]

[[object]]
name = "ComputePipelineState"
protocols = ["MTLComputePipelineState"]

[[object]]
name = "Function"
protocols = ["MTLFunction"]

[[object]]
name = "BinaryArchive"
protocols = ["MTLBinaryArchive"]

[[object]]
name = "DynamicLibrary"
protocols = ["MTLDynamicLibrary"]

[[object]]
name = "CommandQueue"
protocols = ["MTLCommandQueue"]

[[object]]
name = "CommandBuffer"
protocols = ["MTLCommandBuffer"]

[[object]]
name = "Encoder"
protocols = ["MTLCommandEncoder", "MTLRenderCommandEncoder", "MTLComputeCommandEncoder", "MTLBlitCommandEncoder", "MTLParallelRenderCommandEncoder"]

[[object]]
name = "Event"
protocols = ["MTLEvent", "MTLSharedEvent"]

[[object]]
name = "Fence"
protocols = ["MTLFence"]

[[object]]
name = "IndirectCommandBuffer"
protocols = ["MTLIndirectCommandBuffer"]

[[object]]
name = "CounterSampleBuffer"
protocols = ["MTLCounterSampleBuffer"]

[[object]]
name = "ResourceGroup"
protocols = ["MTLResourceGroupSPI"]

[[object]]
name = "VisibleFunctionTable"
protocols = ["MTLVisibleFunctionTable"]

[[object]]
name = "IntersectionFunctionTable"
protocols = ["MTLIntersectionFunctionTable"]

[[object]]
name = "AccelerationStructure"
protocols = ["MTLAccelerationStructure"]

[[object]]
name = "RasterizationRateMap"
protocols = ["MTLRasterizationRateMap"]

# Plain structures. Member names and types follow the iPhoneOS SDK declarations; encodings are the 21H461 method
# encodings in which they appear.
[[struct]]
name = "Origin"
metal = "MTLOrigin"
encoding = "{?=QQQ}"
fields = ["x: u64", "y: u64", "z: u64"]

[[struct]]
name = "Size"
metal = "MTLSize"
encoding = "{?=QQQ}"
fields = ["width: u64", "height: u64", "depth: u64"]

[[struct]]
name = "Region"
metal = "MTLRegion"
encoding = "{?={?=QQQ}{?=QQQ}}"
fields = ["origin: Origin", "size: Size"]

[[struct]]
name = "Range"
metal = "NSRange"
encoding = "{_NSRange=QQ}"
fields = ["location: u64", "length: u64"]

[[struct]]
name = "Viewport"
metal = "MTLViewport"
encoding = "{?=dddddd}"
fields = ["origin_x: f64", "origin_y: f64", "width: f64", "height: f64", "znear: f64", "zfar: f64"]

[[struct]]
name = "ScissorRect"
metal = "MTLScissorRect"
encoding = "{?=QQQQ}"
fields = ["x: u64", "y: u64", "width: u64", "height: u64"]

[[struct]]
name = "ClearColor"
metal = "MTLClearColor"
encoding = "{?=dddd}"
fields = ["red: f64", "green: f64", "blue: f64", "alpha: f64"]

[[struct]]
name = "TextureSwizzleChannels"
metal = "MTLTextureSwizzleChannels"
encoding = "{?=CCCC}"
fields = ["red: u8 (MTLTextureSwizzle)", "green: u8 (MTLTextureSwizzle)", "blue: u8 (MTLTextureSwizzle)", "alpha: u8 (MTLTextureSwizzle)"]

[[struct]]
name = "SamplePosition"
metal = "MTLSamplePosition"
encoding = "{?=ff}"
fields = ["x: f32", "y: f32"]

[[struct]]
name = "VertexAmplificationViewMapping"
metal = "MTLVertexAmplificationViewMapping"
encoding = "{?=II}"
fields = ["viewport_array_index_offset: u32", "render_target_array_index_offset: u32"]

[[struct]]
name = "Hash"
doc = "A SHA-256 digest."
fields = ["bytes: [u8; 32]"]

[[struct]]
name = "FunctionConstant"
doc = "One function constant value (MTLFunctionConstantValues entry): by index, or by name when name is not nil."
fields = ["index: u64", "name: str?", "data_type: u64 (MTLDataType)", "value: bytes"]

[[struct]]
name = "LinkedFunctionGroup"
doc = "One entry of MTLLinkedFunctions.groups (an NSDictionary): a callsite group name and its functions."
dictionary_entry = true
fields = ["name: str", "functions: [Function]"]

# Pipeline reflection, returned by the pipeline-creation replies that ask for it. The guest builds Metal's reflection
# objects from it. Member sets follow the 21H461 MTLArgument, MTLStructMember, MTLArrayType, MTLPointerType and
# MTLTextureReferenceType classes. Nested types are an index into the stage's types table; 0xffffffff is none.
[[struct]]
name = "Reflection"
fields = ["stages: [StageReflection]"]

[[struct]]
name = "StageReflection"
fields = ["function_type: u64 (MTLFunctionType)", "arguments: [ArgumentReflection]", "types: [TypeReflection]"]

[[struct]]
name = "ArgumentReflection"
fields = [
  "name: str",
  "type: u64 (MTLArgumentType)",
  "access: u64 (MTLBindingAccess)",
  "index: u64",
  "active: bool",
  "buffer_alignment: u64",
  "buffer_data_size: u64",
  "buffer_data_type: u64 (MTLDataType)",
  "buffer_struct_type: u32",
  "buffer_pointer_type: u32",
  "buffer_indirect_argument_type: u32",
  "threadgroup_memory_alignment: u64",
  "threadgroup_memory_data_size: u64",
  "texture_type: u64 (MTLTextureType)",
  "texture_data_type: u64 (MTLDataType)",
  "is_depth_texture: bool",
  "array_length: u64",
  "indirect_constant_alignment: u64",
  "indirect_constant_data_size: u64",
  "indirect_constant_data_type: u64 (MTLDataType)",
]

[[struct]]
name = "TypeReflection"
doc = "One MTLType: data_type selects which members are meaningful (struct: members; array: element_*, array_length, stride, argument_index_stride; pointer: element_*, access, alignment, data_size, element_is_argument_buffer; texture reference: texture_*, access, is_depth_texture)."
fields = [
  "data_type: u64 (MTLDataType)",
  "members: [StructMemberReflection]",
  "element_data_type: u64 (MTLDataType)",
  "element_type: u32",
  "array_length: u64",
  "stride: u64",
  "argument_index_stride: u64",
  "access: u64 (MTLBindingAccess)",
  "alignment: u64",
  "data_size: u64",
  "element_is_argument_buffer: bool",
  "texture_data_type: u64 (MTLDataType)",
  "texture_type: u64 (MTLTextureType)",
  "is_depth_texture: bool",
]

[[struct]]
name = "StructMemberReflection"
fields = ["name: str", "offset: u64", "data_type: u64 (MTLDataType)", "type: u32", "argument_index: u64"]

# Failure detail carried by replies and command-buffer completion. status: 0 Ok, 1 MetalError (domain and code are the
# NSError Metal itself returns for this case), 2 Unimplemented (the host does not implement this; the guest reports it
# through the not-implemented channel), 3 HostUnsupported (the host cannot honor a capability the device advertises;
# reported the same way, naming the limit or feature), 4 Invalid (malformed request, unknown handle, protocol violation).
[[struct]]
name = "Failure"
fields = ["status: u32", "domain: str?", "code: i64", "message: str"]

# Descriptors: fields are the settable state of the named 21H461 class (getter/setter pairs and readonly collection
# properties). A collection field carries one element per slot of the array, slot i at position i; the guest sends
# every slot the array has. nil NSArray values are carried as empty arrays.


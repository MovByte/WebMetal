[[op]]
code = 0x0107
name = "Commit"
channel = "control"
methods = ["MTLCommandBuffer commit"]
receiver = "command_buffer"
extra = ["queue", "label", "retained_references", "error_options", "protection_options", "stream", "stream_length", "resources"]
args = ["command_buffer: CommandBuffer", "queue: CommandQueue", "label: str?", "retained_references: bool", "error_options: u64 (MTLCommandBufferErrorOption)", "protection_options: u64", "stream: guest_addr", "stream_length: u64", "resources: [Object]"]
doc = "Submit a command buffer. stream/stream_length locate its command stream in the calling task; the host has consumed the stream before it replies. resources lists every object handle the stream references, once each. label, retained_references, error_options and protection_options are the command buffer's state at commit."


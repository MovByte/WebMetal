# The plugin's classes and the AGXMetalA10 driver class of iPadOS 17.7.11 (21H461) each one stands in for.
#
# UniXNU's scripts/audit-target-web-metal-surface.py generates guest/Generated from this list: the driver selectors of
# each target class (implemented by the plugin class or a LOUD stub), the layout of its Metal.framework base, and the
# audit of the built plugin. A plugin class must subclass the target class's Metal.framework base directly.

[[class]]
name = "WebMetalDevice"
target = "AGXA10XDevice"

[[class]]
name = "WebMetalBuffer"
target = "AGXA10FamilyBuffer"

[[class]]
name = "WebMetalTexture"
target = "AGXA10FamilyTexture"

[[class]]
name = "WebMetalCommandQueue"
target = "AGXA10FamilyCommandQueue"

[[class]]
name = "WebMetalCommandBuffer"
target = "AGXA10FamilyCommandBuffer"

[[class]]
name = "WebMetalRenderCommandEncoder"
target = "AGXA10FamilyRenderContext"

[[class]]
name = "WebMetalComputeCommandEncoder"
target = "AGXA10FamilyComputeContext"

[[class]]
name = "WebMetalBlitCommandEncoder"
target = "AGXA10FamilyBlitContext"

[[class]]
name = "WebMetalParallelRenderCommandEncoder"
target = "AGXA10FamilyThreadedRenderPass"

[[class]]
name = "WebMetalHeap"
target = "AGXA10FamilyHeap"

[[class]]
name = "WebMetalSamplerState"
target = "AGXA10FamilySampler"

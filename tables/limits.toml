]

[[wgsl_language_extension]]
name = "packed_4x8_integer_dot_product"
description = "Supports using 32-bit integer scalars packing 4-component vectors of 8-bit integers as inputs to the dot product instructions with dot4U8Packed and dot4I8Packed built-in functions. Additionally, adds packing and unpacking instructions with packed 4-component vectors of 8-bit integers with pack4xI8, pack4xU8, pack4xI8Clamp, pack4xU8Clamp, unpack4xI8, and unpack4xU8 built-in functions."
cite = [
  { src = "wgsl", ref = "#language-extensions-sec", quote = "packed_4x8_integer_dot_product" },
]

[[wgsl_language_extension]]
name = "unrestricted_pointer_parameters"
description = "Removes the following restrictions from user-defined functions: For user-defined functions, a parameter of pointer type must be in one of the following address spaces: function private Each argument of pointer type to a user-defined function must have the same memory view as its root identifier. NOTE: This means no vector, matrix, array, or structure access expressions can be applied to produce a memory view into the root identifier when traced from the argument back through all the let-declarations."
cite = [
  { src = "wgsl", ref = "#language-extensions-sec", quote = "unrestricted_pointer_parameters" },
]

[[wgsl_language_extension]]
name = "pointer_composite_access"
description = "Supports composite-value decomposition expressions where the root expression is a pointer, yielding a reference. For example, if p is a pointer to a structure with member m, then p.m is a reference to the memory locations for m inside the structure p points to. Similarly, if pa is a pointer to an array, then pa[i] is a reference to the memory locations for the i’th element of the array pa points to."
cite = [
  { src = "wgsl", ref = "#language-extensions-sec", quote = "pointer_composite_access" },
]

[[wgsl_language_extension]]
name = "uniform_buffer_standard_layout"
description = "Allow buffers in the uniform address space to use the same memory layout constraints as other address spaces."
cite = [

[[wgsl_language_extension]]
name = "swizzle_assignment"
description = "Supports swizzle view types. This enables swizzle assignments: a single assignment statement can update multiple components of a vector without having to update the entire vector. For example, if variable v is a 4-element vector, then v.xz = vec2(1,2); is a shorthand way of writing v.x = 1; v.z = 2;, while performing one read and one write. If pointer_composite_access is also supported, then this also works on pointers. If p is a pointer to a vector of at least 3 elements, then p.xz = vec2(1,2); is shorthand for (*p).x = 1; (*p).z = 2;."

  ["MTLVertexFormatCharNormalized", "snorm8"], ["MTLVertexFormatChar2Normalized", "snorm8x2"],
  ["MTLVertexFormatChar4Normalized", "snorm8x4"],
  ["MTLVertexFormatUShort", "uint16"], ["MTLVertexFormatUShort2", "uint16x2"], ["MTLVertexFormatUShort4", "uint16x4"],

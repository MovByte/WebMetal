[[pixel_group]]
id = "stencil-aspect-view"
basis = "Apple describes X32_Stencil8 as the format that reads the stencil value of a combined 32-bit depth and 8-bit stencil texture; WebGPU exposes the stencil aspect of depth32float-stencil8 as its own aspect with aspect-specific format stencil8."
cite = [
  { src = "webgpu", ref = "#depth-formats", quote = "depth32float-stencil8 | 5 − 8 | depth | \"depth\", \"unfilterable-float\" | ✓ | ✗ | 4 | depth32float | stencil | \"uint\" | ✓ | 1 | stencil8" },
]
pairs = [["MTLPixelFormatX32_Stencil8", "depth32float-stencil8"]]


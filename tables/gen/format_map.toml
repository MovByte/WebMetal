# Pairing of Metal pixel and vertex formats with WebGPU formats. gen_formats.py joins this
# with the format lists it reads from the SDK header, Apple's documentation and the
# WebGPU IDL and capability tables. A format the iOS 17.7 API does not contain needs no
# entry: its availability comes from the header. Every other Metal format must appear in
# exactly one group.

[[pixel_group]]
id = "same-format"
basis = "The WebGPU format names the same components in the same order with the same bits per component and data type (and sRGB encoding) as Apple's description of the Metal format; for block-compressed formats, the same compression scheme, block size and encoding."
cite = [
  { src = "webgpu", ref = "#texture-formats", quote = "The name of the format specifies the order of components, bits per component, and data type for the component." },
  { src = "webgpu", ref = "#texture-formats", quote = "If the format has the -srgb suffix, then sRGB conversions from gamma to linear and vice versa are applied during the reading and writing of color values in the shader." },
]
pairs = [
  ["MTLPixelFormatR8Unorm", "r8unorm"], ["MTLPixelFormatR8Snorm", "r8snorm"],
  ["MTLPixelFormatR8Uint", "r8uint"], ["MTLPixelFormatR8Sint", "r8sint"],

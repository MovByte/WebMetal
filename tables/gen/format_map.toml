[[vertex_group]]
id = "candidate"
basis = "The WebGPU vertex format names the same component count, bits per component and data type as Apple's description of the Metal format. Neither text fixes every bit-level detail (WebGPU defers the conversion to channel-format rules, and neither states the bit positions of the 10-10-10-2 layouts), so plan section 5.10 keeps vertex pulling as the default and admits each native pairing only with its own equivalence test."
cite = [
  { src = "webgpu", ref = "#vertex-formats", quote = "The name of the format specifies the order of components, bits per component, and vertex data type for the component." },
  { src = "webgpu", ref = "#vertex-processing", quote = "Convert the data into a shader-visible format, according to channel formats rules." },
]
pairs = [
  ["MTLVertexFormatUChar", "uint8"], ["MTLVertexFormatUChar2", "uint8x2"], ["MTLVertexFormatUChar4", "uint8x4"],
  ["MTLVertexFormatChar", "sint8"], ["MTLVertexFormatChar2", "sint8x2"], ["MTLVertexFormatChar4", "sint8x4"],
  ["MTLVertexFormatUCharNormalized", "unorm8"], ["MTLVertexFormatUChar2Normalized", "unorm8x2"],

[[question]]
id = "6.3-texture-component-swizzle"
plan = "6.3"
question = "Does WebGPU have a texture component swizzle feature?"
status = "resolved"
answer = "Yes: the optional feature \"texture-component-swizzle\" lets a texture view used as a TEXTURE_BINDING rearrange or replace components (r, g, b, a, 0, 1). Without it a view's swizzle must be \"rgba\", so the shader-side swizzle of plan section 6.3 is the fallback."
cite = [
  { src = "webgpu", ref = "#dom-gpufeaturename-texture-component-swizzle", quote = "When enabled: Allows GPUTextureViews to rearrange or replace the color components from texture’s red/green/blue/alpha channels when used as a TEXTURE_BINDING." },
  { src = "webgpu", ref = "#texture-view-creation", quote = "If descriptor.swizzle is not \"rgba\", \"texture-component-swizzle\" must be enabled for this.[[device]]." },
]

[[question]]
id = "6.3-texture-format-tiers"
plan = "6.3"
question = "Which optional features extend format capabilities, and which formats need them?"
status = "resolved"
answer = "texture-formats-tier1 (which enables rg11b10ufloat-renderable) adds RENDER_ATTACHMENT, blending, multisampling and write-only/read-only storage to further formats, including the 16-bit unorm/snorm formats; texture-formats-tier2 (requiring tier1) adds read-write storage to more formats. Others: float32-filterable, float32-blendable, bgra8unorm-storage, depth32float-stencil8 and the three compression features. The per-format conditions are the capability cells of the [[webgpu_texture_format]] rows."
cite = [
  { src = "webgpu", ref = "#texture-formats-tier1", quote = "When enabled: Enables \"rg11b10ufloat-renderable\"." },
  { src = "webgpu", ref = "#feature-dependencies", quote = "\"texture-formats-tier2\" | \"texture-formats-tier1\"" },
]

[[question]]
id = "6.3-unorm16-snorm16"
plan = "6.3"
question = "Are R16/RG16/RGBA16 Unorm and Snorm usable in WebGPU, and with which capabilities?"
status = "resolved"
answer = "Only with the optional feature texture-formats-tier1, and even then their sample type is unfilterable-float: they can be rendered to, blended, multisampled and used as storage, but not sampled with a filtering sampler. A Metal texture of these formats sampled with linear filtering therefore has no native WebGPU form on any host; it needs the manual-filter path (four loads and explicit weights, plan section 5.7) or is LOUD, and on hosts without the feature the format itself is LOUD."
cite = [
  { src = "webgpu", ref = "#plain-color-formats", quote = "r16unorm | \"texture-formats-tier1\" | \"unfilterable-float\" | ✓ | ✓ | ✓ | | ✓ | ✓ | | 2" },
  { src = "webgpu", ref = "#plain-color-formats", quote = "r16snorm | \"texture-formats-tier1\" | \"unfilterable-float\" | ✓ | ✓ | ✓ | | ✓ | ✓ | | 2" },
]

[[question]]
id = "6.3-texel-copy-bit-exactness"
plan = "6.3"
question = "Are WebGPU texel copies (buffer<->texture, texture<->texture) bit-preserving, as the view-reinterpretation and buffer-backed-texture paths of plan sections 6.2 and 6.3 assume?"
status = "resolved"
answer = "No. A texel copy guarantees only that valid, finite, non-subnormal numeric values keep their value: zero signs, subnormals, NaN and infinity bits may change, and snorm and packed formats may change bit representation. Bit-exact round trips are guaranteed only for formats whose every bit pattern is a distinct finite value: the uint, sint and non-packed unorm formats. For float, snorm and packed formats the plan's 'bit-preserving copy through a buffer' is not exact by specification; reinterpretation and coherence for them need a design that never routes the bits through a float-typed texel copy (plan change reported)."
cite = [
  { src = "webgpu", ref = "#texel-copies", quote = "Texel copies only guarantee that valid, finite, non-subnormal numeric values in the source have the same numeric value in the destination." },
  { src = "webgpu", ref = "#texel-copies", quote = "Any floating-point subnormal value may be either preserved or replaced by -0.0 or +0.0. Any floating-point NaN or Infinity value may be replaced by an indeterminate value." },
  { src = "webgpu", ref = "#texel-copies", quote = "Packed formats and snorm formats may change bit-representation as long as the represented values follow the rules above, for example: snorm formats may represent -1.0 as either -127 or -128." },

[[question]]
id = "5.9-multisample-texture-copy"
plan = "5.9"
question = "When can copyTextureToTexture copy multisampled textures?"
status = "resolved"
answer = "Source and destination sample counts must be equal, the copy must cover the whole subresource (for sampleCount > 1 the copy size must equal the physical subresource size), and without core-features-and-limits both sample counts must be 1. Buffer copies never involve multisampled textures."
cite = [

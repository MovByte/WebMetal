[[question]]
id = "5.10-vertex-normalized-conversion"
plan = "5.10"
question = "The normalized-integer conversion Metal specifies for vertex attributes."
status = "open"
reason = "MSL specifies normalized-integer conversion only for texture reads and writes (section 8.7.1); neither the MSL specification nor the MTLVertexFormat documentation pinned here defines it for vertex attributes. Vertex pulling must reproduce the A10X's vertex-fetch conversion, which needs a measurement on the device; the texture rule of 8.7.1.1 is the documented Metal convention but is not stated to apply to vertex fetch. Measured on an Apple M4 only (measurement vertex-fetch-mac; these are M4 data, not A10X facts): every code of the 8- and 16-bit normalized formats, of the 10-10-10-2 formats and of UChar4Normalized_BGRA converts to binary32 and to binary16 with one correct rounding of c / (2^n - 1) (unorm) and of max(-1, c / (2^(n-1) - 1)) (snorm), with one exception: the 10-bit components of Int1010102Normalized fetched as binary32 equal max(-1, c * RN(1/511)), the correctly rounded binary32 product with the binary32 nearest to 1/511, for every code, which differs from the correctly rounded quotient for 96 of the 1024 codes (each of the three 10-bit lanes takes every code). AirWgsl's vertex pulling reproduces these results; the A10X's conversion remains unmeasured."

[[question]]
id = "6.3-srgb-filter-order"
plan = "6.3"
question = "Is sRGB decoding applied before filtering in both APIs?"
status = "resolved"
answer = "MSL requires the sRGB-to-linear conversion before the sampler's filter. The WebGPU text says only that conversions are applied when the shader reads; it does not state the order relative to filtering. Native sampling of -srgb formats is therefore exact for nearest filtering and for loads; with linear filtering it depends on a host property the specification does not fix, which needs a per-host equivalence test (V4) before it is relied on."
cite = [
  { src = "msl", ref = "8.7.7", quote = "The conversion from sRGB to linear RGB is performed before the filter specified in the sampler specified when sampling the texture is applied." },
  { src = "webgpu", ref = "#texture-formats", quote = "If the format has the -srgb suffix, then sRGB conversions from gamma to linear and vice versa are applied during the reading and writing of color values in the shader." },
]

[[question]]
id = "6.3-unorm-write-rounding"
plan = "6.3"
question = "Metal's rounding rule when writing float values to 5-, 6- and other unorm formats."
status = "resolved"
answer = "Clamp f*(2^n - 1) to [0, 2^n - 1] and convert with round-to-nearest-even (intRTNE), for n = 1, 2, 4, 5, 6, 8, 10 and 16; NaN converts to 0. The packed 16-bit formats B5G6R5, A1BGR5, ABGR4 and BGR5A1 use the 5-, 6-, 4- and 1-bit rows."
cite = [
  { src = "msl", ref = "8.7.1.2", quote = "NaN values are converted to zero." },
  { src = "msl", ref = "8.7.1.2", quote = "x = min(max(f * 31.0, 0.0), 31.0) unsigned integer i4:0 = intRTNE(x)" },
  { src = "msl", ref = "8.7.1.2", quote = "x = min(max(f * 63.0, 0.0), 63.0) i5:0 = intRTNE(x)" },
]

[[question]]
id = "6.3-unorm-snorm-read"
plan = "6.3"
question = "Metal's conversion of normalized integer texels to float when reading and sampling."
status = "resolved"
answer = "unorm: float(c) / (2^n - 1); snorm: max(-1.0, float(c) / (2^(n-1) - 1)), with the most negative code and its neighbor both giving -1.0; precision at most 1.5 ulp except the exact corner cases (0, the maximum, and -1)."
cite = [
  { src = "msl", ref = "8.7.1.1", quote = "The precision of the conversion rules is guaranteed to be <= 1.5 ulp, except for the cases described in the “Corner Cases” column." },
  { src = "msl", ref = "8.7.1.1", quote = "max(-1.0, float(c)/127.0) -128 and -127 must convert to -1.0" },
]

[[question]]
id = "6.3-xr-encoding"
plan = "6.3"
question = "The extended-range (XR) encoding Metal defines for BGR10_XR and BGRA10_XR."
status = "resolved"
answer = "Each 10-bit code v maps to (v - 384) / 510.0, covering [-0.752941, 1.25098]. BGR10_XR packs blue, green, red from the least significant bit with bits 30-31 zero; BGRA10_XR stores each component in the top 10 bits of a 16-bit chunk (bits 6-15) with zero padding, and clamps alpha to [0, 1]. The values (v - 384)/510 are not all representable in binary16, as plan section 6.3 states."
cite = [
  { src = "apple-bgr10-xr", quote = "The formula used in this linear encoding is shader_float = (xr10_value - 384) / 510.0f." },
  { src = "apple-bgr10-xr", quote = "Pixel components are in blue, green, and red order, from least significant bit to most significant bit. Bits 30 and 31 are padding, and their value is 0." },
  { src = "apple-bgra10-xr", quote = "The 10 most-significant bits (bits 6–15) store the component’s data." },
  { src = "apple-bgra10-xr", quote = "The alpha component is always clamped to a [0.0, 1.0] range in sampling, rendering, and writing operations, despite supporting values outside this range." },
]

[[question]]
id = "6.3-422-chroma"
plan = "6.3"
question = "Component order and chroma siting of GBGR422 and BGRG422."
status = "open"
reason = "The header defines the byte order (GBGR422: Y0, Cb, Y1, Cr; BGRG422: Cb, Y0, Cr, Y1), that no YUV-to-RGB conversion happens and that the shader receives (Cr, Y, Cb, 1), widths must be even, and only 2D non-mipmapped textures with clamp-to-edge are allowed. It does not state how the shared chroma is reconstructed for the second pixel of a pair or under linear filtering; that is hardware behavior needing a measurement on the A10X. Device support for these formats is D1's."
cite = [
  { sdk = "Metal.framework/Headers/MTLPixelFormat.h", quote = "The component order, from lowest addressed byte to highest, is Y0, Cb, Y1, Cr. There is no implicit colorspace conversion from YUV to RGB, the shader will receive (Cr, Y, Cb, 1)." },
  { sdk = "Metal.framework/Headers/MTLPixelFormat.h", quote = "422 textures must have a width that is a multiple of 2, and can only be used for 2D non-mipmap textures. When sampling, ClampToEdge is the only usable wrap mode." },
]

[[question]]
id = "6.3-eac-r11-decode"
plan = "6.3"
question = "The exact decoded value of R11/RG11 EAC texels, and whether r16unorm can hold it."
status = "open"
reason = "Resolved for the specification: Khronos defines the decoded value as an 11-bit integer x in [0, 2047] representing x/2047, and lets an implementation extend x to 16 or more bits by bit replication ((x << 5) + (x >> 6) for 16 bits). x/2047 is not representable in r16unorm (65535/2047 is not an integer), while the 16-bit replication is. Which of the two values the A10X returns to a shader is hardware behavior and needs a measurement on the device; until then the software path stores decoded texels in r32float only if that reproduces the device's value, which is unknown, so non-native R11/RG11 sampling is LOUD."
cite = [
  { src = "kdfs", ref = "#Section-r11eac", quote = "The result will be an 11-bit fixed point number where 0 represents 0.0 and 2047 represents 1.0. This is the exact representation for the decoded value." },
  { src = "kdfs", ref = "#Section-r11eac", quote = "In this case, the 11-bit value should be extended using bit replication." },
]


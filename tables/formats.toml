[[question]]
id = "5.10-unaligned-vertex-fetch"
plan = "5.10"
question = "What does Metal do with a vertex descriptor whose strides or offsets are not multiples of 4 on a device that reports supportsUnalignedVertexFetch = NO, as the A10X does?"
status = "resolved"
answer = "21H461's Metal.framework does not validate it: -[MTLVertexDescriptorInternal validateWithVertexFunction:error:renderPipelineDescriptor:] and newSerializedDescriptor check only that an attribute's buffer has a stride, the step rates and the format against the attribute's type, and the only use of supportsUnalignedVertexFetch is MTLGetCompilerOptions (0x187a9acdc), which sets compiler option bit 0x20000 when the device supports it, so the pipeline is created and the vertex compiler is told the device cannot fetch unaligned data. Only the API validation layer (MetalTools, MTL_DEBUG_LAYER) checks, at draw and stage-in dispatch time: -[MTLDebugRenderCommandEncoder validateCommonDrawErrors:instanceCount:baseInstance:maxVertexID:] (0x216edd054) and -[MTLDebugComputeCommandEncoder dispatchThreadgroups:threadsPerThreadgroup:] (0x216eaa5a4) report \"providing stride of %u to buffer-layout index %u, but device only supports strides that are a multiple of 4 bytes.\" for a static or dynamic stride that is not a multiple of 4; attribute offsets are not checked. Without the layer the result of fetching unaligned data on the A10X is not defined. On a device with unaligned fetch (measured on an Apple M4) such descriptors fetch the addressed bytes."
cite = [
  { measure = "vertex-fetch-mac", case = "UShort3-stride-6", quote = "equal_to_the_bytes_read: 192" },
  { measure = "vertex-fetch-mac", case = "UInt-offset-2", quote = "equal_to_the_bytes_read: 63" },
]


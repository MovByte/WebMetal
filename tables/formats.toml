[[question]]
id = "5.5-depth-texture-as-color"
plan = "5.5"
question = "What does Metal define for a depth texture bound to a texture2d<float> argument, and for a color texture bound to depth2d?"
status = "resolved"
answer = "MSL defines only the type rule: for T = float the texture data must be a normalized, half or single-precision format, which Depth16Unorm and Depth32Float are, so a depth texture can be read through texture2d<float>; depth types require T = float and sample_compare needs a depth type. MSL does not define the values of the components other than the depth value. WebGPU gives (D, X, X, X) with X implementation-defined unless texture-component-swizzle is enabled, in which case (D, 0, 0, 1). The depth component therefore matches; reads of the other components are outside both specifications. Binding a non-depth format to a depth type is not defined by MSL (V1 records real Metal's behavior with and without the debug layer)."
cite = [
  { src = "msl", ref = "2.9", quote = "If T is float, the data associated with the texture must either be a normalized (signed or unsigned integer), half or single-precision format." },
  { src = "msl", ref = "2.9", quote = "For depth texture types, T must be float." },
  { src = "webgpu", ref = "#reading-depth-stencil", quote = "If the \"texture-component-swizzle\" feature is enabled, reading or sampling the depth or stencil aspect of a texture behaves as if the texture contains the values (V, 0, 0, 1) where V is the actual depth or stencil value. Otherwise, the values are (V, X, X, X) where each X is an implementation-defined unspecified value." },
]


[package]
name = "webmetal-host"
version = "0.1.0"
description = "WebMetal host executor: replays the wire protocol on WebGPU"
edition.workspace = true
license.workspace = true

[features]
# The WebGPU binding over the webgpu.h C API (Dawn or wgpu-native); build.rs describes how one is selected.
native = ["dep:bindgen"]
# The WebGPU binding over the browser's WebGPU, for wasm32.
web = ["dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures"]

[dependencies]
webmetal-wire = { path = "../wire" }
# The AIR to WGSL compiler (UniXNU `kits/AirWgsl`), pinned to a commit of its public repository so that every checkout
# of this crate (a clone of its own, the UniXNU submodule, a vendored copy) builds with the same compiler. It has no
# dependencies and builds for the native and the wasm32 targets alike. To build against a local AirWgsl checkout,
# patch the source in an untracked `.cargo/config.toml`:
#
#     [patch."https://github.com/MovByte/AirWgsl"]
#     airwgsl = { path = "/path/to/AirWgsl" }
airwgsl = { git = "https://github.com/MovByte/AirWgsl", rev = "8dc0da5acb091beda089f2b0f46ed4d436d077c9" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The wasm-bindgen crate and the wasm-bindgen CLI that post-processes the module must be the same version.
wasm-bindgen = { version = "=0.2.105", optional = true }
js-sys = { version = "=0.3.82", optional = true }
wasm-bindgen-futures = { version = "=0.4.55", optional = true }

[build-dependencies]
bindgen = { version = "0.72", optional = true, default-features = false, features = ["runtime"] }

[[example]]
name = "gpu_web_smoke"
crate-type = ["cdylib"]
required-features = ["web"]
